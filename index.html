<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thiệp chúc mừng 20/10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --plum: #3a0f33;
      --wine: #6b1d4f;
      --rose: #e8557a;
      --blush: #ffd9e2;
      --peach: #ffb88c;
      --gold: #f5c97a;
      --cream: #fff6f1
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      height: 100dvh
    }

    body {
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      color: var(--cream);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(60vmax 60vmax at 15% 10%, #8a2a5e 0%, transparent 60%),
        radial-gradient(50vmax 50vmax at 90% 90%, #c2415f 0%, transparent 55%),
        linear-gradient(160deg, var(--plum), #240820);
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .35;
      animation: float 14s ease-in-out infinite alternate
    }

    .glow.a {
      width: 40vmax;
      height: 40vmax;
      background: var(--rose);
      left: -10vmax;
      top: -10vmax
    }

    .glow.b {
      width: 34vmax;
      height: 34vmax;
      background: var(--peach);
      right: -8vmax;
      bottom: -12vmax;
      animation-delay: -6s
    }

    @keyframes float {
      to {
        transform: translate(4vmax, 3vmax) scale(1.15)
      }
    }

    /* ===== Phong bì ===== */
    #intro,
    #card {
      grid-area: 1/1
    }

    #intro {
      position: relative;
      z-index: 10;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
      transition: opacity .9s, transform .9s
    }

    #intro.hide {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
      transition-duration: .45s
    }

    #intro h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 8vw, 3.2rem);
      color: var(--blush);
      text-shadow: 0 0 30px rgba(232, 85, 122, .6)
    }

    .env {
      position: relative;
      width: min(300px, 78vw);
      height: 200px;
      perspective: 900px;
      animation: bob 3s ease-in-out infinite;
      margin-top: 130px
    }

    @keyframes bob {
      50% {
        transform: translateY(-8px)
      }
    }

    .env .back {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background: linear-gradient(160deg, #c2415f, #8a2a5e);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, .6), 0 0 60px rgba(232, 85, 122, .35)
    }

    .env .mini {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 8px;
      height: 170px;
      z-index: 1;
      border-radius: 6px;
      background: linear-gradient(160deg, var(--cream), var(--blush));
      display: grid;
      place-items: start center;
      padding-top: 14px;
      font-family: 'Dancing Script', cursive;
      font-size: 2.6rem;
      color: var(--rose);
      transition: transform 1s .55s cubic-bezier(.3, 1.2, .4, 1), opacity .3s
    }

    .env .lining {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: 8px;
      clip-path: polygon(0 0, 100% 0, 50% 55%);
      background: linear-gradient(180deg, #5e1642, #8a2a5e)
    }

    .env .front {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 8px;
      clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
      background: linear-gradient(160deg, #d44a6e, #a1325f)
    }

    .env .flap {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 58%;
      z-index: 3;
      transform-origin: top;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: linear-gradient(180deg, #e8557a, #c2415f);
      transition: transform .8s ease, z-index 0s .4s
    }

    .env .seal {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 4;
      width: 44px;
      height: 44px;
      margin: -6px 0 0 -22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 22px;
      background: radial-gradient(circle at 35% 30%, #ffe9a8, var(--gold) 60%, #c98a2e);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
      transition: transform .5s, opacity .4s
    }

    .env.open .flap {
      transform: rotateX(180deg);
      z-index: 0
    }

    .env.open .seal {
      transform: scale(2);
      opacity: 0
    }

    .env.open .mini {
      transform: translateY(-125px)
    }

    .env.open.pull .mini {
      transform: translateY(-260px) scale(1.12);
      opacity: 0;
      transition: transform .7s ease-in, opacity .5s .2s
    }

    .field {
      width: min(320px, 86vw);
      margin-top: 10px
    }

    .field input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 999px;
      border: 1.5px solid rgba(255, 217, 226, .35);
      background: rgba(255, 255, 255, .09);
      color: var(--cream);
      font: inherit;
      text-align: center;
      outline: none;
      transition: .2s
    }

    .field input::placeholder {
      color: rgba(255, 246, 241, .55)
    }

    .field input:focus {
      border-color: var(--gold);
      background: rgba(255, 255, 255, .15);
      box-shadow: 0 0 24px rgba(245, 201, 122, .3)
    }

    .btn {
      padding: 14px 36px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font: 500 1rem 'Be Vietnam Pro', sans-serif;
      color: var(--plum);
      background: linear-gradient(135deg, var(--gold), var(--peach));
      box-shadow: 0 10px 30px -8px rgba(245, 201, 122, .8);
      transition: .2s;
      position: relative;
      overflow: hidden
    }

    .btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .7), transparent);
      transform: skewX(-20deg);
      animation: shine 3s infinite
    }

    @keyframes shine {
      to {
        left: 130%
      }
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.03)
    }

    .btn:focus-visible,
    .field input:focus-visible,
    .mbtn:focus-visible {
      outline: 2px solid var(--cream);
      outline-offset: 3px
    }

    /* ===== Thiệp ===== */
    #card {
      position: relative;
      z-index: 10;
      width: min(470px, 100%);
      max-height: calc(100dvh - 32px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 30px;
      color: var(--wine);
      background: linear-gradient(160deg, rgba(255, 246, 241, .98), rgba(255, 214, 225, .97));
      box-shadow: 0 50px 100px -25px rgba(0, 0, 0, .7), 0 0 80px rgba(232, 85, 122, .35), inset 0 0 0 1px rgba(255, 255, 255, .7);
      opacity: 0;
      pointer-events: none;
      transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .15s
    }

    #card .scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      text-align: center;
      padding: clamp(28px, 6vw, 40px) clamp(28px, 7vw, 48px) 36px;
      scrollbar-width: thin;
      scrollbar-color: rgba(232, 85, 122, .45) transparent;
      -webkit-mask-image: linear-gradient(transparent, #000 24px, #000 calc(100% - 28px), transparent);
      mask-image: linear-gradient(transparent, #000 24px, #000 calc(100% - 28px), transparent)
    }

    #card.open {
      opacity: 1;
      pointer-events: auto;
      animation: cardIn 1.6s cubic-bezier(.2, .9, .3, 1.05)
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: perspective(900px) translateY(60px) scale(.7) rotateX(30deg)
      }

      to {
        opacity: 1;
        transform: perspective(900px) translateY(0) scale(1) rotateX(0deg)
      }
    }

    #card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 21px;
      pointer-events: none;
      z-index: 2;
      border: 1.5px solid rgba(214, 160, 84, .6)
    }

    #card::after {
      content: "";
      position: absolute;
      top: 0;
      left: -80%;
      width: 50%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
      transform: skewX(-18deg)
    }

    #card.open::after {
      animation: sweep 1.6s 1.4s ease-out 1
    }

    @keyframes sweep {
      to {
        left: 140%
      }
    }

    .flower {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 4px
    }

    .rays {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 260px;
      height: 260px;
      margin: -130px 0 0 -130px;
      border-radius: 50%;
      opacity: 0;
      background: repeating-conic-gradient(rgba(255, 200, 140, .5) 0 5deg, transparent 5deg 20deg);
      -webkit-mask: radial-gradient(circle, #000 8%, transparent 68%);
      mask: radial-gradient(circle, #000 8%, transparent 68%)
    }

    #card.open .rays {
      animation: fadeIn 1.5s 1.6s forwards, spin 24s linear infinite
    }

    @keyframes fadeIn {
      to {
        opacity: 1
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .p {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50% 50% 50% 50%/85% 85% 15% 15%;
      transform-origin: 50% 100%;
      opacity: 0;
      transform: rotate(var(--a)) scale(0)
    }

    .p.o {
      width: 50px;
      height: 80px;
      margin: -80px 0 0 -25px;
      background: linear-gradient(180deg, #ffc2d1, var(--rose));
      box-shadow: inset 0 -10px 16px rgba(150, 20, 70, .3)
    }

    .p.m {
      width: 40px;
      height: 62px;
      margin: -62px 0 0 -20px;
      background: linear-gradient(180deg, #ffd6e0, #f5708f);
      box-shadow: inset 0 -8px 12px rgba(150, 20, 70, .25)
    }

    .p.n {
      width: 28px;
      height: 44px;
      margin: -44px 0 0 -14px;
      background: linear-gradient(180deg, #fff0f4, #ff8aa8)
    }

    #card.open .p {
      animation: bloom 1.2s cubic-bezier(.2, 1.3, .4, 1) forwards;
      animation-delay: calc(.9s + var(--d)*1s)
    }

    @keyframes bloom {
      from {
        opacity: 0;
        transform: rotate(calc(var(--a) - 50deg)) scale(0)
      }

      to {
        opacity: 1;
        transform: rotate(var(--a)) scale(1)
      }
    }

    .core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 50%;
      transform: scale(0);
      background: radial-gradient(circle at 35% 30%, #fff1b8, var(--gold) 55%, #d99a3d);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, .4), 0 0 30px rgba(245, 201, 122, 1)
    }

    #card.open .core {
      animation: pop .7s 2.2s cubic-bezier(.2, 1.6, .4, 1) forwards
    }

    @keyframes pop {
      to {
        transform: scale(1)
      }
    }

    .bloomwrap {
      position: absolute;
      inset: 0
    }

    #card.open .bloomwrap {
      animation: sway 5s 3s ease-in-out infinite alternate
    }

    @keyframes sway {
      from {
        transform: rotate(-5deg) scale(1)
      }

      to {
        transform: rotate(5deg) scale(1.05)
      }
    }

    .big {
      font-family: 'Dancing Script', cursive;
      font-weight: 700;
      font-size: clamp(3rem, 13vw, 4.4rem);
      line-height: 1;
      background: linear-gradient(100deg, #b57a1f, #f7d58a, #b57a1f, #f7d58a);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gold 4s linear infinite
    }

    @keyframes gold {
      to {
        background-position: -250% 0
      }
    }

    #card h2 {
      font-weight: 500;
      font-size: clamp(1rem, 4.2vw, 1.2rem);
      letter-spacing: .02em;
      color: var(--wine);
      margin: 2px 0 10px
    }

    .to {
      font-size: 1.02rem;
      margin-bottom: 10px
    }

    .to b {
      font-family: 'Dancing Script', cursive;
      font-size: 1.7rem;
      color: var(--rose);
      display: block;
      line-height: 1.2;
      margin-top: 2px
    }

    #msg {
      white-space: pre-line;
      line-height: 1.75;
      font-weight: 300;
      font-size: .97rem;
      color: #5b2346;
      text-wrap: pretty
    }

    #msg .rest {
      color: transparent
    }

    #msg.typing span:first-child::after {
      content: "|";
      animation: blink .8s steps(1) infinite;
      color: var(--rose)
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    .sign {
      margin-top: 8px;
      font-family: 'Dancing Script', cursive;
      font-size: 1.6rem;
      color: var(--wine);
      opacity: 0;
      transition: opacity 1s
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
      opacity: 0;
      transition: opacity 1s
    }

    .sign.show,
    .actions.show {
      opacity: 1
    }

    .btn.alt {
      background: linear-gradient(135deg, var(--rose), #c2415f);
      color: #fff;
      box-shadow: 0 10px 26px -8px rgba(232, 85, 122, .8);
      padding: 12px 24px;
      font-size: .92rem
    }

    .btn.ghost {
      background: transparent;
      color: var(--wine);
      box-shadow: inset 0 0 0 1.5px rgba(107, 29, 79, .35);
      padding: 12px 24px;
      font-size: .92rem
    }

    .btn.ghost::after {
      display: none
    }

    /* Nút nhạc */
    .mbtn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 30;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 217, 226, .5);
      background: rgba(58, 15, 51, .55);
      backdrop-filter: blur(8px);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 0
    }

    .mbtn.show {
      display: flex
    }

    .mbtn i {
      width: 3px;
      height: 6px;
      border-radius: 2px;
      background: var(--blush);
      transform-origin: bottom
    }

    .mbtn.on i {
      animation: eq .9s ease-in-out infinite alternate
    }

    .mbtn.on i:nth-child(2) {
      animation-delay: -.3s
    }

    .mbtn.on i:nth-child(3) {
      animation-delay: -.6s
    }

    .mbtn.on i:nth-child(4) {
      animation-delay: -.15s
    }

    .mbtn.hint {
      animation: ring 1.2s infinite
    }

    @keyframes eq {
      to {
        transform: scaleY(3.2)
      }
    }

    @keyframes ring {
      0% {
        box-shadow: 0 0 0 0 rgba(245, 201, 122, .8)
      }

      100% {
        box-shadow: 0 0 0 18px rgba(245, 201, 122, 0)
      }
    }

    #yt {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 2px;
      height: 2px;
      opacity: 0;
      pointer-events: none
    }

    .heart {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      font-size: 22px;
      animation: up 1.9s ease-out forwards
    }

    @keyframes up {
      to {
        transform: translate(var(--dx), -220px) scale(1.7);
        opacity: 0
      }
    }

    @media (max-height:720px) {
      #intro {
        gap: 12px
      }

      .env {
        height: 150px;
        margin-top: 96px
      }

      .env .mini {
        height: 126px;
        font-size: 2rem
      }

      .env.open .mini {
        transform: translateY(-92px)
      }

      #intro h1 {
        font-size: 1.8rem
      }

      .flower {
        width: 120px;
        height: 120px;
        transform: scale(.7);
        margin: -14px auto -10px
      }

      #msg {
        min-height: 8.5em
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .glow,
      .env,
      .big,
      .btn::after,
      #card.open::after {
        animation: none
      }

      #card.open {
        animation: none
      }
    }
  </style>
</head>

<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <canvas id="fx"></canvas>
  <div id="yt"></div>
  <button class="mbtn" id="mbtn" aria-label="Bật hoặc tắt nhạc"><i></i><i></i><i></i><i></i></button>

  <section id="intro">
    <h1>Có một lá thư gửi đến những người phụ nữ</h1>
    <div class="env" id="env" aria-hidden="true">
      <div class="back"></div>
      <div class="mini">20/10</div>
      <div class="lining"></div>
      <div class="front"></div>
      <div class="flap"></div>
      <div class="seal">💌</div>
    </div>
    <button class="btn" id="openBtn">Mở thiệp</button>
  </section>

  <main id="card">
    <div class="scroll" id="scroll">
      <div class="flower" aria-hidden="true">
        <div class="rays"></div>
        <div class="bloomwrap" id="bloom"></div>
      </div>
      <div class="big">20/10</div>
      <h2>Chúc mừng ngày Phụ nữ Việt Nam</h2>
      <p class="to">Gửi đến<b>những người phụ nữ tuyệt vời</b></p>
      <p id="msg"></p>
      <p class="sign" id="sign">Với tất cả yêu thương 💐</p>
      <div class="actions" id="actions">
        <button class="btn alt" id="burstBtn">Gửi thêm yêu thương</button>
        <button class="btn ghost" id="againBtn">Viết lại</button>
      </div>
    </div>
  </main>

  <script>
    /* ==========================================================
       CÀI ĐẶT NHẠC: dán link YouTube vào đây, hoặc truyền qua địa chỉ:
       thiep-20-10-wow.html?nhac=https://youtu.be/XXXXXXXXXXX
       ========================================================== */
    const YOUTUBE_URL = "https://youtu.be/GxldQ9eX2wo";

    (() => {
      const $ = id => document.getElementById(id);
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const q = new URLSearchParams(location.search);

      /* ---------- Tạo hoa (3 vòng cánh) ---------- */
      const bloom = $('bloom');
      const ring = (cls, n, off, d0) => {
        for (let i = 0; i < n; i++) {
          const s = document.createElement('span'); s.className = 'p ' + cls;
          s.style.setProperty('--a', (360 / n * i + off) + 'deg');
          s.style.setProperty('--d', (d0 + i * .07).toFixed(2)); bloom.appendChild(s);
        }
      };
      ring('o', 8, 0, 0); ring('m', 8, 22.5, .25); ring('n', 6, 10, .5);
      const core = document.createElement('span'); core.className = 'core'; bloom.appendChild(core);

      /* ---------- Canvas: sao, cánh hoa, pháo hoa ---------- */
      const cv = $('fx'), ctx = cv.getContext('2d');
      let W, H, DPR, stars = [];
      const pc = ['#ff8aa5', '#ffb3c4', '#e8557a', '#ffd9e2', '#ffc7a8', '#f7a6c0', '#fff0f3'];
      const fc = ['#ffd9e2', '#f5c97a', '#ff8aa5', '#ffffff', '#ffb88c'];
      let petals = [], sparks = [], density = 26;

      function resize() {
        DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
        cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        stars = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .3, t: Math.random() * 6.28, s: .01 + Math.random() * .03 }));
      }
      addEventListener('resize', resize); resize();

      const newPetal = (top = true, x, y, burst = false) => ({
        x: x ?? Math.random() * W, y: y ?? (top ? -20 - Math.random() * H * .3 : Math.random() * H), s: 8 + Math.random() * 14, c: pc[Math.random() * pc.length | 0],
        vy: burst ? -(2 + Math.random() * 4) : .6 + Math.random() * 1.3, vx: burst ? (Math.random() - .5) * 7 : (Math.random() - .5) * .6,
        rot: Math.random() * 6.28, vr: (Math.random() - .5) * .05, sw: Math.random() * 6.28, sws: .01 + Math.random() * .02, swa: .4 + Math.random() * .8,
        fl: Math.random() * 6.28, fls: .02 + Math.random() * .04, a: .65 + Math.random() * .35, burst
      });
      for (let i = 0; i < density; i++) petals.push(newPetal(false));

      function drawPetal(p) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.fl) * .85 + .15); ctx.globalAlpha = p.a;
        const g = ctx.createLinearGradient(0, -p.s, 0, p.s); g.addColorStop(0, '#fff'); g.addColorStop(.35, p.c); g.addColorStop(1, p.c);
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, -p.s);
        ctx.bezierCurveTo(p.s * .9, -p.s * .6, p.s * .8, p.s * .7, 0, p.s); ctx.bezierCurveTo(-p.s * .8, p.s * .7, -p.s * .9, -p.s * .6, 0, -p.s); ctx.fill(); ctx.restore();
      }

      function frame() {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
          s.t += s.s; ctx.globalAlpha = .25 + .6 * Math.abs(Math.sin(s.t)); ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
        }
        for (let i = 0; i < petals.length; i++) {
          const p = petals[i]; p.sw += p.sws; p.x += p.vx + Math.sin(p.sw) * p.swa; p.y += p.vy;
          if (p.burst) { p.vy += .08; p.vx *= .985; if (p.vy > 1.4) { p.burst = false; p.vy = .8 + Math.random(); p.vx = (Math.random() - .5) * .6; } }
          p.rot += p.vr; p.fl += p.fls; drawPetal(p);
          if (p.y > H + 30 || p.x < -60 || p.x > W + 60) { if (petals.length > density && !p.burst) { petals.splice(i, 1); i--; } else petals[i] = newPetal(true); }
        }
        ctx.globalCompositeOperation = 'lighter';
        for (let i = sparks.length - 1; i >= 0; i--) {
          const k = sparks[i]; k.x += k.vx; k.y += k.vy; k.vy += k.g; k.vx *= k.f; k.vy *= k.f; k.life--;
          if (k.life <= 0) { sparks.splice(i, 1); continue; }
          const a = k.life / k.max; ctx.globalAlpha = a; ctx.fillStyle = k.c;
          ctx.beginPath(); ctx.arc(k.x, k.y, k.r * (.4 + a), 0, 6.28); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      const burstPetals = (x, y, n = 36) => { if (!reduce) for (let i = 0; i < n; i++) petals.push(newPetal(false, x, y, true)); };
      function firework(x, y) {
        if (reduce) return;
        const col = fc[Math.random() * fc.length | 0], n = 70;
        for (let i = 0; i < n; i++) {
          const a = Math.PI * 2 * i / n, sp = 1.5 + Math.random() * 4.5, m = 60 + Math.random() * 50 | 0;
          sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: .045, f: .975, life: m, max: m, r: 1.6 + Math.random() * 1.4, c: Math.random() < .3 ? '#fff' : col });
        }
      }
      function show(n = 5) { for (let i = 0; i < n; i++) setTimeout(() => firework(W * (.15 + Math.random() * .7), H * (.12 + Math.random() * .4)), i * 420); }

      /* sao lấp lánh theo con trỏ + nghiêng thiệp 3D */
      let last = 0;
      addEventListener('pointermove', e => {
        const now = performance.now();
        if (!reduce && now - last > 35) {
          last = now;
          sparks.push({ x: e.clientX, y: e.clientY, vx: (Math.random() - .5) * .8, vy: (Math.random() - .5) * .8, g: .02, f: .97, life: 34, max: 34, r: 1.8, c: fc[Math.random() * fc.length | 0] });
        }
        if (!reduce && e.pointerType === 'mouse') {
          $('card').style.setProperty('--ry', ((e.clientX / W - .5) * 10) + 'deg');
          $('card').style.setProperty('--rx', (-(e.clientY / H - .5) * 10) + 'deg');
        }
      });

      /* ---------- Nhạc YouTube ---------- */
      const musicUrl = q.get('nhac') || YOUTUBE_URL;
      const mm = musicUrl.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
      const vid = mm ? mm[1] : null;
      const tm = musicUrl.match(/[?&](?:t|start)=(\d+)/);
      let player = null, apiReady = false, wantPlay = false;
      const mbtn = $('mbtn');
      const setOn = on => { mbtn.classList.toggle('on', on); if (on) mbtn.classList.remove('hint'); };

      function makePlayer() {
        player = new YT.Player('yt', {
          width: '2', height: '2', videoId: vid,
          playerVars: { autoplay: 1, controls: 0, loop: 1, playlist: vid, playsinline: 1, rel: 0, modestbranding: 1, start: tm ? +tm[1] : 0 },
          events: {
            onReady: e => { e.target.setVolume(85); e.target.playVideo(); setTimeout(() => { if (e.target.getPlayerState() !== 1) mbtn.classList.add('hint'); }, 2500); },
            onStateChange: e => setOn(e.data === 1),
            onAutoplayBlocked: () => mbtn.classList.add('hint')
          }
        });
      }
      if (vid) {
        mbtn.classList.add('show');
        const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
        window.onYouTubeIframeAPIReady = () => { apiReady = true; if (wantPlay) makePlayer(); };
      }
      function startMusic() {
        if (!vid) return; wantPlay = true;
        if (player && player.playVideo) player.playVideo(); else if (apiReady) makePlayer();
      }
      mbtn.addEventListener('click', () => {
        if (!player || !player.getPlayerState) { startMusic(); return; }
        player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
      });

      /* ---------- Lời chúc ---------- */
      const WISH = `Nhân ngày 20/10, xin gửi đến những người phụ nữ Việt Nam lời tri ân chân thành nhất.

Cảm ơn các bạn, các cô, các chị, các mẹ, các bà, những người đã lặng lẽ giữ cho mái nhà luôn ấm, giữ cho bữa cơm luôn đầy tiếng cười. Có những hy sinh không ai kể thành lời, có những mệt mỏi được giấu sau nụ cười dịu dàng, và có những nỗi lo chỉ mình các bạn biết. Nhưng chính từ sự kiên cường ấy, cuộc sống của biết bao người trở nên bình yên hơn.

Người phụ nữ không chỉ mạnh mẽ khi vượt qua sóng gió, mà còn mạnh mẽ cả khi dám dừng lại để nghỉ ngơi, dám nói "mình mệt rồi" và dám yêu thương chính mình. Hãy nhớ rằng bạn không cần phải hoàn hảo để xứng đáng được trân trọng. Bạn đã đủ tốt, đủ đẹp và đủ giá trị ngay từ chính con người mình.

Chúc những người phụ nữ luôn có sức khỏe để theo đuổi điều mình yêu, có bình an để mỉm cười mỗi sáng thức dậy, và có những người bên cạnh biết lắng nghe, biết sẻ chia. Chúc những ước mơ dang dở được viết tiếp, những nỗ lực thầm lặng được ghi nhận, và những giọt nước mắt, nếu có, đều được ôm lấy bằng sự dịu dàng.

Mong rằng hôm nay, và cả những ngày sau, bạn luôn được yêu thương nhiều như cách bạn đã yêu thương mọi người. Dù là ai, ở nơi đâu, làm công việc gì, bạn vẫn luôn là điều tuyệt vời của thế giới này.`;

      let timer;
      function typeText(el, text, speed, done) {
        clearTimeout(timer); el.classList.add('typing');
        const a = document.createElement('span'), b = document.createElement('span'); b.className = 'rest';
        el.replaceChildren(a, b);
        if (reduce) { a.textContent = text; el.classList.remove('typing'); done && done(); return; }
        const card = $('scroll'); let i = 0;
        (function step() {
          i = Math.min(i + 2, text.length);
          a.textContent = text.slice(0, i); b.textContent = text.slice(i);
          const r = a.getBoundingClientRect(), c = card.getBoundingClientRect();
          if (r.bottom > c.bottom - 60) card.scrollTop += r.bottom - (c.bottom - 60);
          if (i < text.length) timer = setTimeout(step, speed); else { el.classList.remove('typing'); done && done(); }
        })();
      }

      function openCard() {
        if ($('intro').classList.contains('hide')) return;
        $('sign').classList.remove('show'); $('actions').classList.remove('show');
        startMusic();                       // chạy ngay trong thao tác bấm để trình duyệt cho phép phát nhạc
        $('env').classList.add('open');
        setTimeout(() => $('env').classList.add('pull'), 1800);
        setTimeout(() => $('intro').classList.add('hide'), 2300);
        setTimeout(() => {
          $('card').classList.add('open');
          density = 70; for (let i = 0; i < 40; i++) petals.push(newPetal(true));
          burstPetals(W / 2, H * .45, 60); show(6);
          setTimeout(() => typeText($('msg'),
            WISH, 22,
            () => { $('sign').classList.add('show'); $('actions').classList.add('show'); show(3); setTimeout(() => $('scroll').scrollTo({ top: $('scroll').scrollHeight, behavior: 'smooth' }), 400); }), 2400);
        }, 2750);
      }

      function reset() {
        clearTimeout(timer); $('scroll').scrollTop = 0; $('card').classList.remove('open'); $('msg').textContent = ''; density = 26;
        $('env').classList.remove('open', 'pull');
        setTimeout(() => $('intro').classList.remove('hide'), 500);
      }

      function hearts(x, y) {
        if (reduce) return; const set = ['💖', '🌸', '💗', '🌷', '✨'];
        for (let i = 0; i < 9; i++) {
          const h = document.createElement('span'); h.className = 'heart'; h.textContent = set[Math.random() * set.length | 0];
          h.style.left = x + (Math.random() - .5) * 60 + 'px'; h.style.top = y + 'px'; h.style.setProperty('--dx', (Math.random() - .5) * 180 + 'px');
          h.style.animationDelay = i * 60 + 'ms'; document.body.appendChild(h); setTimeout(() => h.remove(), 2300 + i * 60);
        }
      }

      $('openBtn').addEventListener('click', openCard);
      $('burstBtn').addEventListener('click', e => {
        const r = e.currentTarget.getBoundingClientRect();
        burstPetals(r.left + r.width / 2, r.top, 70); hearts(r.left + r.width / 2, r.top); show(5);
      });
      $('againBtn').addEventListener('click', reset);
      $('card').addEventListener('pointerdown', e => { if (!e.target.closest('button')) { burstPetals(e.clientX, e.clientY, 14); firework(e.clientX, e.clientY); } });

    })();
  </script>
</body>
